
name: Build IXON Node-RED ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-node-red:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout IXON project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node-RED for ARM64/v8
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --file node-red/Dockerfile \
            --tag node-red-opc-ua:ixon-arm64-v8 \
            --output type=docker,dest=/tmp/node-red-opc-ua.tar \
            ./node-red

      - name: Compress Docker image
        run: gzip -1 /tmp/node-red-opc-ua.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: ixon-node-red-arm64-v8
          path: /tmp/node-red-opc-ua.tar.gz
          retention-days: 7
          compression-level: 0
